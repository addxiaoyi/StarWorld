name: Java 21 build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verification-tools:
    name: Evidence and acceptance tool tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify evidence collectors
        run: python -m unittest discover -s tools -p 'test_*.py' -v
      - name: Verify acceptance tools
        working-directory: tools/paper-client
        run: npm test

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify
        run: |
          chmod +x mvnw
          ./mvnw -B --no-transfer-progress verify
      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: starworld-plugin
          path: target/starworld-*.jar
          if-no-files-found: error
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starworld-test-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          if-no-files-found: warn
