# Local city needs. No money, StarCore resources, offline catch-up or registration-only rewards.
civic-needs-version: 1
limits:
  maximum-page: 32
  maximum-offset: 10000
  # Display records only. Requests and spent-action tombstones are permanent.
  history-limit: 200
needs:
